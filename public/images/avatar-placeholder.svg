<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Sijia Wen monogram</title>
  <desc id="desc">Abstract navy monogram panel with the initials WSJ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="1" stop-color="#12345f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <path d="M0 470L800 350V600H0Z" fill="#ffffff" opacity="0.025"/>

  <g stroke="#9fc1ef" stroke-opacity="0.45" fill="none">
    <path d="M40 72V40H72"/>
    <path d="M728 40H760V72"/>
    <path d="M760 528V560H728"/>
    <path d="M72 560H40V528"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="400" y="304" font-size="132" font-weight="600" letter-spacing="-8" fill="#ffffff">WSJ</text>
    <text x="400" y="352" font-size="12" font-weight="600" letter-spacing="4.5" fill="#9fc1ef">BACKEND ARCHITECT</text>
    <text x="400" y="516" font-size="11" letter-spacing="2.6" fill="#ffffff" fill-opacity="0.42">CHENGDU · CHINA</text>
  </g>

  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="2" fill="#ffffff" fill-opacity="0.4">
    <text x="48" y="58">PROFILE / 01</text>
    <text x="752" y="558" text-anchor="end">PORTFOLIO</text>
  </g>
</svg>
